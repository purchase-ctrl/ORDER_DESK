<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
/* Layout: a glossy beauty-counter ledger. Gradient masthead, one colour per company, rainbow-topped
   position tiles, pill tabs, soft rounded cards. Orchid/coral/violet/mint on blush. */
:root{
  --bg:#fff4f8; --surface:#ffffff; --ink:#2d1733; --muted:#82687f; --line:#f1d8e5; --head:#fdeaf3;
  --accent:#d6246e; --accent-ink:#ffffff; --accent-soft:#fde3ee;
  --c1:#ff7a59; --c2:#d6246e; --c3:#7c4dff; --c4:#12a58a;
  --glow1:rgba(255,122,89,.20); --glow2:rgba(124,77,255,.16);
  --ok:#0f7a58; --ok-bg:#d8f5e8; --warn:#a85a08; --warn-bg:#ffebd0; --bad:#c42a45; --bad-bg:#ffdfe5; --neutral-bg:#f6e6ef;
  --shadow:0 6px 20px rgba(150,40,100,.10);
  --font:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --display:'Fraunces',Georgia,'Times New Roman',serif;
  --mono:'DM Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1b0f20; --surface:#2a1930; --ink:#fbe9f3; --muted:#c7a6bf; --line:#46294d; --head:#36223d;
    --accent:#ff6fa8; --accent-ink:#2a0a1a; --accent-soft:#4a2145;
    --c1:#ff8f70; --c2:#ff6fa8; --c3:#a98bff; --c4:#3fd1b3;
    --glow1:rgba(255,122,89,.16); --glow2:rgba(124,77,255,.22);
    --ok:#6fe0b4; --ok-bg:#12372c; --warn:#ffbf70; --warn-bg:#40290e; --bad:#ff93a6; --bad-bg:#43182a; --neutral-bg:#36223d;
    --shadow:0 6px 20px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1b0f20; --surface:#2a1930; --ink:#fbe9f3; --muted:#c7a6bf; --line:#46294d; --head:#36223d;
  --accent:#ff6fa8; --accent-ink:#2a0a1a; --accent-soft:#4a2145;
  --c1:#ff8f70; --c2:#ff6fa8; --c3:#a98bff; --c4:#3fd1b3;
  --glow1:rgba(255,122,89,.16); --glow2:rgba(124,77,255,.22);
  --ok:#6fe0b4; --ok-bg:#12372c; --warn:#ffbf70; --warn-bg:#40290e; --bad:#ff93a6; --bad-bg:#43182a; --neutral-bg:#36223d;
  --shadow:0 6px 20px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background-color:var(--bg);background-image:radial-gradient(900px 420px at 0% -5%,var(--glow1),transparent 70%),radial-gradient(800px 420px at 100% 0%,var(--glow2),transparent 70%);background-repeat:no-repeat;color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;padding-inline:16px;padding-block:20px 56px}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--display);font-style:italic;font-weight:600;font-size:34px;line-height:1.1;margin:0;letter-spacing:-.01em;text-wrap:balance;background:linear-gradient(90deg,var(--c1),var(--c2) 50%,var(--c3));-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:2px}
h2{font-family:var(--display);font-weight:600;font-size:21px;margin:0;text-wrap:balance}
h3{font-size:14px;margin:0}
p{margin:0}
.muted{color:var(--muted)}
.top{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:flex-end;justify-content:space-between}
.sync{font-size:12px;color:var(--muted);font-family:var(--mono);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 12px}
.cos{display:flex;flex-wrap:wrap;gap:10px}
.co{--co:var(--c2);font:inherit;font-weight:700;padding:11px 20px 11px 16px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;cursor:pointer;text-align:left;min-width:0;box-shadow:var(--shadow);display:inline-flex;align-items:center;gap:10px}
.co::before{content:"";flex:none;width:12px;height:12px;border-radius:50%;background:var(--co)}
.co:nth-child(1){--co:var(--c1)}.co:nth-child(2){--co:var(--c2)}.co:nth-child(3){--co:var(--c3)}
.co[aria-pressed="true"]{background:var(--co);color:#fff;border-color:var(--co)}
.co[aria-pressed="true"]::before{background:#fff}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.kpi{--k:var(--c2);background:var(--surface);padding:14px 18px 14px;min-width:0;border-radius:18px;border:1px solid var(--line);box-shadow:var(--shadow);border-top:5px solid var(--k)}
.kpi:nth-child(4n+1){--k:var(--c1)}.kpi:nth-child(4n+2){--k:var(--c2)}.kpi:nth-child(4n+3){--k:var(--c3)}.kpi:nth-child(4n+4){--k:var(--c4)}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--k);font-weight:700}
.kpi .v{font-family:var(--mono);font-size:24px;font-weight:500;margin:3px 0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .s{font-size:12px;color:var(--muted)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow);width:fit-content;max-width:100%}
.tab{background:none;border:0;border-radius:999px;padding:9px 16px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{color:#fff;background:linear-gradient(90deg,var(--c1),var(--c2) 60%,var(--c3))}
.tab .c{font-family:var(--mono);font-size:11px;font-weight:500;background:var(--neutral-bg);color:var(--muted);border-radius:10px;padding:1px 7px;margin-left:6px}
.tab[aria-selected="true"] .c{background:rgba(255,255,255,.28);color:#fff}
.ph{display:flex;flex-wrap:wrap;gap:10px 20px;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.ph>div{min-width:0;max-width:640px}
.pt{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:inherit;font-weight:600;padding:8px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.primary{background:linear-gradient(90deg,var(--c2),var(--c3));color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(214,36,110,.28)}
.btn.sm{padding:5px 12px;font-size:12px}
.lnk{background:none;border:0;color:var(--accent);font:inherit;font-weight:700;cursor:pointer;padding:2px 6px}
.lnk.del{color:var(--bad)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;width:100%;min-width:0}
input[type="search"]{width:220px;max-width:100%;border-radius:999px}
input[type="checkbox"]{width:auto}
textarea{resize:vertical}
.form{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;margin-bottom:18px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px 14px}
.f{min-width:0}
.f label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px}
.f small{display:block;color:var(--c2);font-size:12px;margin-top:3px;font-family:var(--mono)}
.f.wide{grid-column:1/-1}
.fa{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ferr{color:var(--bad);font-weight:600}
.prev{display:flex;flex-wrap:wrap;gap:6px 28px;padding:12px 16px;background:var(--accent-soft);border-radius:14px}
.pv .l{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.pv .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500}
.block{margin-bottom:24px}
.bh{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:center;margin-bottom:10px}
.bh .cnt{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:8px;font-weight:500}
.bt{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chk{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:18px;background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:max-content}
th{background:var(--head);text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);padding:11px 12px;white-space:nowrap;font-weight:700;border-bottom:1px solid var(--line)}
th.r{text-align:right}
td{padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--head)}
td.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
td.mono{font-family:var(--mono)}
td.wrap{white-space:normal;min-width:200px}
td.act{text-align:right}
tfoot td{background:var(--head);font-weight:700;border-top:1px solid var(--line);border-bottom:0}
.chip{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.n0{background:var(--neutral-bg);color:var(--muted)}
.sub{display:block;font-size:12px;color:var(--muted);font-family:var(--mono)}
.bar{display:inline-block;width:84px;height:8px;border-radius:4px;background:var(--neutral-bg);overflow:hidden;vertical-align:middle;margin-right:8px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--c1),var(--c2))}
.empty{border:2px dashed var(--line);border-radius:22px;padding:30px 22px;background:var(--surface)}
.empty h3{font-family:var(--display);font-size:18px;margin-bottom:4px}
.note{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;background:var(--warn-bg);color:var(--warn);border-radius:14px;padding:10px 16px;font-weight:500}
.note .btn{color:var(--ink)}
.note+.note{margin-top:8px}
.note.due{background:var(--bad-bg);color:var(--bad)}
.bk{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.gate{position:fixed;inset:0;z-index:50;overflow:auto;display:grid;place-items:center;padding:24px 16px;background-color:var(--bg);background-image:radial-gradient(700px 480px at 12% 8%,var(--glow1),transparent 70%),radial-gradient(700px 520px at 90% 90%,var(--glow2),transparent 70%)}
.gate[hidden],.wrap[hidden]{display:none}
.gcard{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:28px;box-shadow:0 18px 50px rgba(150,40,100,.18);padding:30px 28px;display:flex;flex-direction:column;gap:18px}
.gbrand{display:flex;align-items:center;gap:12px}
.gmark{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--c1),var(--c2) 55%,var(--c3));flex:none}
.gbrand b{display:block;font-family:var(--display);font-style:italic;font-size:22px;line-height:1.1}
.gbrand span{color:var(--muted);font-size:12px}
.gcard h2{font-size:24px}
.gform{display:flex;flex-direction:column;gap:14px}
.gpw{position:relative}
.gpw input{padding-right:64px}
.gpw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:12px}
.gcard .btn.primary{padding:11px 16px;font-size:15px}
.gfoot{font-size:12px;color:var(--muted)}
.gfoot .lnk{padding:0;font-size:12px}
.gout{display:inline-flex;gap:8px;align-items:center}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;max-width:calc(100% - 32px);z-index:10}
@media (max-width:640px){
  h1{font-size:28px}
  .co{flex:1 1 100%}
  .kpi .v{font-size:21px}
  input[type="search"]{width:100%}
  .pt{width:100%}
  .tabs{border-radius:22px;width:auto}
}
@media (prefers-reduced-motion:no-preference){
  .btn,.co,.tab{transition:background-color .15s,border-color .15s,color .15s,transform .15s}
  .btn:hover,.co:hover{transform:translateY(-1px)}
}
</style>
<title>Order &amp; Payment Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Fraunces:ital,wght@1,600&family=Fraunces:wght@600&display=swap">


</head>
<body>
<div id="gate" class="gate" role="dialog" aria-modal="true" aria-labelledby="gt" hidden>
  <div class="gcard">
    <div class="gbrand"><i class="gmark"></i><div><b>Order &amp; Payment Desk</b><span>Sunshine Industries · Sunshine Cosmetics · Dyana International</span></div></div>
    <div><h2 id="gt"></h2><p id="gsub" class="muted"></p></div>
    <form id="gform" class="gform" novalidate>
      <div class="f"><label for="g_user">Username</label><input id="g_user" type="text" autocomplete="username" autocapitalize="none" spellcheck="false"></div>
      <div class="f"><label for="g_pass">Password</label><div class="gpw"><input id="g_pass" type="password" autocomplete="current-password"><button type="button" class="lnk" id="g_show">Show</button></div></div>
      <div class="f" id="g_c_wrap" hidden><label for="g_conf">Confirm password</label><input id="g_conf" type="password" autocomplete="new-password"></div>
      <span id="g_err" class="ferr" role="alert"></span>
      <button class="btn primary" type="submit" id="g_go"></button>
    </form>
    <p class="gfoot" id="gfoot"></p>
  </div>
</div>
<div class="wrap" hidden>
  <header class="top">
    <div>
      <h1>Order &amp; Payment Desk</h1>
      <p class="muted">Advance, invoicing and dispatch for each company, in one format.</p>
    </div>
    <div class="bk"><span id="sync" class="sync"></span><span id="who" class="sync"></span><button class="btn sm" data-act="logout">Log out</button><button class="btn sm" data-act="backup">Backup</button><button class="btn sm" data-act="restore">Restore</button><input type="file" id="restoreFile" accept="application/json,.json" hidden></div>
  </header>
  <nav id="cos" class="cos" aria-label="Company"></nav>
  <div id="banner"></div>
  <section id="kpis" class="kpis" aria-label="Current position"></section>
  <div id="tabs" class="tabs" role="tablist" aria-label="Sections"></div>
  <main id="panel"></main>
</div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
(function(){
'use strict';

/* ---------- constants ---------- */
const COS=[{key:'si',name:'Sunshine Industries'},{key:'scp',name:'Sunshine Cosmetics Pvt Ltd'},{key:'di',name:'Dyana International'}];
const SECS=['clients','products','advances','invoices','payments','dispatches'];
const TLAB={clients:'Client / Brand',products:'Products',advances:'Advance',invoices:'Daily Invoicing',payments:'Payment Status',dispatches:'Pending Dispatch',admin:'Admin'};
const ADD={clients:'Add client',products:'Add product',advances:'Add advance received',invoices:'Add invoice',payments:'Record payment',dispatches:'Log dispatch'};
const INTRO={
  clients:'The brands and companies you supply. Products, advances and invoices all sit under a client.',
  products:'Final cost, advance % and payment terms for each product. Advance and invoices read from here.',
  advances:'Advance received against each PO, in as many parts as it arrives. Required advance = PO quantity × final cost × advance %.',
  invoices:'Each invoice takes cost and payment terms from the product, adds 18% GST and adjusts the advance already received for that PO.',
  admin:'Manage users and every entry in this company. The admin can edit or delete any entry. Other users can change only the entries they added.',
  payments:'Every invoice with what is due, what has been received and what is still pending. Record each payment as it comes in.',
  dispatches:'What is still to ship against each PO, and the dispatches already logged.'
};
const GST=0.18, TOL=1;

/* ---------- helpers ---------- */
const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf2=new Intl.NumberFormat('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const nf0=new Intl.NumberFormat('en-IN',{maximumFractionDigits:0});
const inr=v=>'₹'+nf2.format(v||0);
const qty=v=>nf0.format(v||0);
const advUnit=p=>{if(!p)return 0;const c=+p.cost||0;if(p.advPct!=null&&p.advPct!=='')return c*(+p.advPct||0)/100;return +p.advPerUnit||0;};
const advPctOf=p=>{if(!p)return null;if(p.advPct!=null&&p.advPct!=='')return +p.advPct;const c=+p.cost||0;return c>0?(+p.advPerUnit||0)/c*100:null;};
const pct=v=>(Math.round(v*10)/10).toFixed(1)+'%';
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fd=s=>{if(!s)return '—';const p=s.split('-').map(Number);return String(p[2]).padStart(2,'0')+'-'+MON[p[1]-1]+'-'+String(p[0]).slice(2);};
const addDays=(s,n)=>{const p=s.split('-').map(Number);return new Date(Date.UTC(p[0],p[1]-1,p[2]+n)).toISOString().slice(0,10);};
const daysBetween=(a,b)=>{const x=a.split('-').map(Number),y=b.split('-').map(Number);return Math.round((Date.UTC(y[0],y[1]-1,y[2])-Date.UTC(x[0],x[1]-1,x[2]))/864e5);};
const todayStr=()=>{const t=new Date();return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const byName=(a,b)=>String(a.name||'').localeCompare(String(b.name||''));
const norm=s=>String(s||'').trim().toUpperCase();
const gkey=(po,pid)=>norm(po)+'|'+pid;

/* ---------- state ---------- */
const S={co:'si',tab:'invoices',q:'',showDone:false,form:null,delArm:null,blocks:[]};
const D={};
COS.forEach(c=>{D[c.key]={};SECS.forEach(s=>{D[c.key][s]=new Map();});});
let store=null, dl=null, R=null, delTimer=null, toastTimer=null;

function loadUI(){try{const u=JSON.parse(localStorage.getItem('orderdesk:ui')||'{}');if(COS.some(c=>c.key===u.co))S.co=u.co;if(SECS.includes(u.tab)||u.tab==='admin')S.tab=u.tab;}catch(e){}}
function saveUI(){try{localStorage.setItem('orderdesk:ui',JSON.stringify({co:S.co,tab:S.tab}));}catch(e){}}
const lsKey=(k,s)=>'orderdesk:data:'+k+':'+s;
function loadLocal(){COS.forEach(c=>SECS.forEach(s=>{try{JSON.parse(localStorage.getItem(lsKey(c.key,s))||'[]').forEach(r=>D[c.key][s].set(r.id,r));}catch(e){}}));}
function saveLocal(k,s){try{localStorage.setItem(lsKey(k,s),JSON.stringify([...D[k][s].values()]));}catch(e){}}

function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.hidden=true;},3200);}

/* ---------- storage ---------- */
async function put(sec,row){
  const k=S.co,id=row.id||uid();
  const r=JSON.parse(JSON.stringify(Object.assign({},row,{id:id})));
  const prev=D[k][sec].get(id);
  if(prev&&!canModify(prev)){toast('You can only edit entries you added.');return false;}
  if(prev){['createdBy','createdByName','createdAt'].forEach(f=>{if(prev[f]!==undefined)r[f]=prev[f];});}
  else if(ME){r.createdBy=ME.id;r.createdByName=ME.user;r.createdAt=todayStr();}
  D[k][sec].set(id,r);
  if(store){
    try{await store.collection(k+'_'+sec).doc(id).set(r);}
    catch(e){if(prev)D[k][sec].set(id,prev);else D[k][sec].delete(id);refresh();toast('Could not save: '+((e&&(e.message||e.code))||'unknown error'));return false;}
  }else{saveLocal(k,sec);}
  refresh();return true;
}
async function del(sec,id){
  const k=S.co,prev=D[k][sec].get(id);
  if(prev&&!canModify(prev)){toast('You can only delete entries you added.');return false;}
  D[k][sec].delete(id);
  if(store){
    try{await store.collection(k+'_'+sec).doc(id).delete();}
    catch(e){if(prev)D[k][sec].set(id,prev);refresh();toast('Could not delete: '+((e&&(e.message||e.code))||'unknown error'));return false;}
  }else{saveLocal(k,sec);}
  refresh();return true;
}

/* ---------- calculations ---------- */
function dataFor(key,over){
  const d=D[key];
  const o={clients:d.clients,products:d.products,advances:[...d.advances.values()],invoices:[...d.invoices.values()],payments:[...d.payments.values()],dispatches:[...d.dispatches.values()]};
  if(over){o[over.sec]=o[over.sec].filter(r=>r.id!==over.row.id);o[over.sec].push(over.row);}
  return o;
}
function calc(d){
  const P=d.products,C=d.clients;
  const prod=id=>P.get(id)||null;
  const cli=p=>p?(C.get(p.clientId)||null):null;
  const srt=(a,b)=>String(a.date||'').localeCompare(String(b.date||''))||String(a.id||'').localeCompare(String(b.id||''));
  const groups=new Map();
  const G=(po,pid)=>{const k=gkey(po,pid);let g=groups.get(k);if(!g){g={k:k,po:String(po||'').trim(),pid:pid,poQty:0,poRate:0,received:0,invQty:0,adjusted:0,dispQty:0,logQty:0,hasAdv:false};groups.set(k,g);}return g;};

  const adv=[...d.advances].sort(srt);
  adv.forEach(a=>{const g=G(a.po,a.productId);g.hasAdv=true;g.poQty=Math.max(g.poQty,+a.poQty||0);if(+a.poRate)g.poRate=+a.poRate;g.received+=+a.received||0;});

  const payBy=new Map();d.payments.forEach(x=>payBy.set(x.invoiceId,(payBy.get(x.invoiceId)||0)+(+x.amount||0)));
  const inv=[...d.invoices].sort(srt).map(i=>{
    const p=prod(i.productId),g=G(i.po,i.productId);
    const q=+i.qty||0,cost=p?+p.cost||0:0,au=advUnit(p);
    g.invQty+=q;
    const nonGst=q*cost,extra=+i.extra||0,gst=(nonGst+extra)*GST,total=nonGst+extra+gst;
    const avail=Math.max(0,g.received-g.adjusted);
    const adj=Math.min(q*au,nonGst,avail);
    g.adjusted+=adj;
    const net=total-adj,paid=(+i.paid||0)+(payBy.get(i.id)||0),pend=Math.max(0,net-paid);
    const due=i.date?addDays(i.date,p?+p.terms||0:0):'';
    return Object.assign({},i,{p:p,c:cli(p),g:g,q:q,nonGst:nonGst,extra:extra,gst:gst,total:total,adj:adj,net:net,paid:paid,legacyPaid:+i.paid||0,pend:pend,due:due,
      remain:g.poQty>0?g.poQty-g.invQty:null,advLeft:g.received-g.adjusted,
      status:pend<=TOL?'Paid':(paid>0?'Partial':'Unpaid')});
  });

  const invById=new Map(inv.map(i=>[i.id,i]));const payRun=new Map();
  const pay=[...d.payments].sort(srt).map(x=>{const i=invById.get(x.invoiceId)||null;const cum=(payRun.get(x.invoiceId)||0)+(+x.amount||0);payRun.set(x.invoiceId,cum);
    return Object.assign({},x,{i:i,p:i?i.p:null,c:i?i.c:null,amt:+x.amount||0,pendAfter:i?Math.max(0,i.net-i.legacyPaid-cum):null});});
  const dis=[...d.dispatches].sort(srt).map(x=>{const p=prod(x.productId),g=G(x.po,x.productId);const q=+x.qty||0;g.logQty+=q;return Object.assign({},x,{p:p,c:cli(p),q:q});});

  groups.forEach(g=>{
    const p=prod(g.pid);
    g.p=p;g.c=cli(p);g.advUnit=advUnit(p);
    g.required=g.poQty*g.advUnit;g.orderValue=g.poQty*g.poRate;
    g.pending=Math.max(0,g.required-g.received);g.excess=Math.max(0,g.received-g.required);
    g.recvPct=g.required>0?g.received/g.required*100:null;
    g.unadj=g.received-g.adjusted;
    g.dispQty=Math.max(g.invQty,g.logQty);
    g.pendDisp=g.poQty>0?Math.max(0,g.poQty-g.dispQty):null;
    g.ready=Math.max(0,g.invQty-g.logQty);
  });

  const run=new Map();
  const advRows=adv.map(a=>{
    const g=groups.get(gkey(a.po,a.productId));
    const cum=(run.get(g.k)||0)+(+a.received||0);run.set(g.k,cum);
    const req=g.required;
    return Object.assign({},a,{p:g.p,c:g.c,g:g,req:req,pctThis:req>0?(+a.received||0)/req*100:null,cum:cum,pendAfter:Math.max(0,req-cum),pendPct:req>0?Math.max(0,req-cum)/req*100:null});
  });

  const gl=[...groups.values()];
  const sum=(arr,f)=>arr.reduce((s,x)=>s+(f(x)||0),0);
  const today=todayStr();
  const t={
    advReceived:sum(advRows,r=>+r.received),
    advPending:sum(gl.filter(g=>g.hasAdv),g=>g.pending),
    outstanding:sum(inv,i=>i.pend),
    overdue:inv.filter(i=>i.pend>TOL&&i.due&&daysBetween(today,i.due)<0).length,
    toDispatch:sum(gl,g=>g.pendDisp||0),
    ready:sum(gl,g=>g.ready),
    openPOs:gl.filter(g=>g.pendDisp>0).length,
    poCount:gl.filter(g=>g.hasAdv).length
  };
  return {groups:gl,advRows:advRows,inv:inv,pay:pay,dis:dis,t:t};
}

function cellHTML(c,r){

function filtered(b){

}
function blockHTML(b){
  const rows=filtered(b);

  let h='<section class="block"><div class="bh"><h3>'+esc(b.title)+'<span class="cnt">'+cnt+'</span></h3><div class="bt">'+(b.extra||'')+
    (dl&&b.rows.length?'<button class="btn sm" data-act="csv" data-b="'+b.id+'">Export CSV</button>':'')+'</div></div>';
  if(!b.rows.length){return h+'<div class="empty"><h3>'+esc(b.empty[0])+'</h3><p class="muted">'+esc(b.empty[1])+'</p></div></section>';}
  if(!rows.length){return h+'<div class="empty"><h3>No rows match</h3><p class="muted">Clear the search to see every row.</p></div></section>';}
  h+='<div class="tw"><table><thead><tr>'+b.cols.map(c=>'<th class="'+(c.cls==='n'?'r':'')+'">'+esc(c.h)+'</th>').join('')+((b.edit||b.acts)?'<th></th>':'')+'</tr></thead><tbody>';
  rows.forEach(r=>{
    h+='<tr>'+b.cols.map(c=>'<td class="'+(c.cls||'')+'">'+cellHTML(c,r)+'</td>').join('');
    if(b.edit||b.acts)h+='<td class="act">'+(b.acts?b.acts(r):stdActs(b.edit,r))+'</td>';
    h+='</tr>';
  });
  h+='</tbody>';
  if(b.cols.some(c=>c.s)){
    h+='<tfoot><tr>'+b.cols.map((c,i)=>{if(i===0)return '<td>Total</td>';if(!c.s)return '<td></td>';const s=rows.reduce((a,r)=>a+(+c.t(r)||0),0);return '<td class="n">'+esc(c.fmt(s))+'</td>';}).join('')+((b.edit||b.acts)?'<td></td>':'')+'</tr></tfoot>';
  }
  return h+'</table></div></section>';
}

  });

function readForm(sec){
  const id=S.form.id||undefined;
  if(sec==='clients'){
    const name=val('c_name');if(!name)return {err:'Client name is required.'};
    return {row:{id:id,name:name,brand:val('c_brand'),gstin:val('c_gstin').toUpperCase(),contact:val('c_contact'),phone:val('c_phone'),email:val('c_email'),city:val('c_city'),address:val('c_addr'),notes:val('c_notes')}};
  }
  if(sec==='products'){
    const clientId=val('p_client'),name=val('p_name'),cost=num('p_cost'),adv=num('p_adv');
    if(!clientId)return {err:'Select the client.'};
    if(!name)return {err:'Product name is required.'};
    if(!(cost>0))return {err:'Enter the final cost per unit.'};
    if(adv>100)return {err:'Advance cannot be more than 100% of the final cost.'};
    const dup=[...D[S.co].products.values()].some(p=>p.id!==id&&p.clientId===clientId&&norm(p.name)===norm(name));
    if(dup)return {err:'This client already has a product with that name.'};
    return {row:{id:id,clientId:clientId,name:name,cost:cost,advPct:adv,terms:Math.max(0,parseInt(val('p_terms'),10)||0)}};
  }
  if(sec==='payments'){
    if(!val('pm_inv'))return {err:'Select the invoice.'};
    if(!val('pm_date'))return {err:'Enter the date received.'};
    if(!(num('pm_amt')>0))return {err:'Enter the amount received.'};
    return {row:{id:id,invoiceId:val('pm_inv'),date:val('pm_date'),amount:num('pm_amt'),mode:val('pm_mode'),ref:val('pm_ref'),note:val('pm_note')}};
  }
  const pid=val('f_product'),po=val('f_po');
  if(!pid)return {err:'Select the client and product.'};
  if(!po)return {err:'PO number is required.'};
  if(sec==='advances'){
    if(!val('a_date'))return {err:'Enter the date received.'};
    if(!(num('a_qty')>0))return {err:'Enter the PO quantity.'};
    if(!(num('a_rate')>0))return {err:'Enter the PO rate.'};
    if(!(num('a_recv')>0))return {err:'Enter the advance received.'};
    return {row:{id:id,date:val('a_date'),productId:pid,po:po,poQty:num('a_qty'),poRate:num('a_rate'),received:num('a_recv'),note:val('a_note')}};
  }
  if(sec==='invoices'){
    const no=val('i_no');
    if(!no)return {err:'Invoice number is required.'};
    if([...D[S.co].invoices.values()].some(i=>i.id!==id&&norm(i.invNo)===norm(no)))return {err:'An invoice with this number already exists.'};
    if(!val('i_date'))return {err:'Enter the invoice date.'};
    if(!(num('i_qty')>0))return {err:'Enter the invoice quantity.'};
    return {row:{id:id,date:val('i_date'),invNo:no,productId:pid,po:po,qty:num('i_qty'),extra:num('i_extra'),paid:(D[S.co].invoices.get(id)||{}).paid||0}};
  }
  if(!val('d_date'))return {err:'Enter the dispatch date.'};
  if(!(num('d_qty')>0))return {err:'Enter the quantity dispatched.'};
  return {row:{id:id,date:val('d_date'),productId:pid,po:po,qty:num('d_qty'),invNo:val('d_inv'),transporter:val('d_trans'),lr:val('d_lr'),status:val('d_status')||'Dispatched'}};
}

async function exportCsv(bid){
  const b=S.blocks.find(x=>x.id===bid);if(!b||!dl)return;
  const q=s=>{s=String(s==null?'':s);return /[",\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
  const lines=[b.cols.map(c=>q(c.h)).join(',')];
  filtered(b).forEach(r=>lines.push(b.cols.map(c=>{const v=c.t(r);return q(typeof v==='number'?Math.round(v*100)/100:v);}).join(',')));
  const co=COS.find(c=>c.key===S.co).name;
  try{await dl.save({filename:(co+' - '+b.name+'.csv').replace(/[\\/:*?"<>|]/g,'-'),data:'﻿'+lines.join('\r\n')});}
  catch(e){if(!e||e.code!=='declined')toast('Could not save the file.');}
}

async function tryDelete(sec,id){

  if(sec==='clients'&&[...d.products.values()].some(p=>p.clientId===id)){toast('Delete this client’s products first.');return;}
  if(sec==='invoices'&&[...d.payments.values()].some(p=>p.invoiceId===id)){toast('This invoice has payments recorded. Delete those first.');return;}

  }
  await del(sec,id);
}

  const k=S.co;const jobs=[];
  SECS.forEach(s=>D[k][s].forEach((r,id)=>{if(r.sample)jobs.push([s,id]);}));
  for(const j of jobs){
    D[k][j[0]].delete(j[1]);
    if(store){try{await store.collection(k+'_'+j[0]).doc(j[1]).delete();}catch(e){}}else saveLocal(k,j[0]);
  }
  refresh();toast('Example rows cleared');
}
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');if(!a)return;
  const act=a.dataset.act;
  if(act==='co'){S.co=a.dataset.co;S.form=null;S.q='';saveUI();buildAll();}
  else if(act==='urole'){const u=USERS.get(a.dataset.id);if(isAdmin()&&u&&u.id!==ME.id)putUser(Object.assign({},u,{role:u.role==='admin'?'user':'admin'})).then(ok=>{if(ok){toast(u.user+' is now '+(u.role==='admin'?'a user':'an admin'));refresh();}});}
  else if(act==='upw'){if(isAdmin())showPwReset(a.dataset.id);}
  else if(act==='udel'){
    const id=a.dataset.id,key='u:'+id;
    if(S.delArm===key){S.delArm=null;clearTimeout(delTimer);if(isAdmin()&&ME&&id!==ME.id)removeUser(id).then(ok=>{if(ok){toast('User deleted');refresh();}});}
    else{S.delArm=key;clearTimeout(delTimer);delTimer=setTimeout(()=>{S.delArm=null;renderList();},4000);renderList();}
  }
  else if(act==='tab'||act==='goto'){if(a.dataset.tab==='admin'&&!isAdmin())return;S.tab=a.dataset.tab;S.form=null;S.q='';saveUI();renderTabs();buildPanel();}
  else if(act==='add'){S.form={sec:S.tab,id:null};showForm();}
  else if(act==='remind'){S.form=null;showReminder(a.dataset.id);}
  else if(act==='openmail'){openMail();}
  else if(act==='copymail'){copyMail();}
  else if(act==='payfor'){S.form={sec:'payments',id:null,inv:a.dataset.id};showForm();const f=$('#frm');if(f&&f.scrollIntoView)f.scrollIntoView({block:'nearest'});}
  else if(act==='cancel'){S.form=null;$('#formHost').innerHTML='';}
  else if(act==='edit'){S.form={sec:a.dataset.sec,id:a.dataset.id};showForm();const f=$('#frm');if(f&&f.scrollIntoView)f.scrollIntoView({block:'nearest'});}
  else if(act==='del'){
    const id=a.dataset.id;
    if(S.delArm===id){S.delArm=null;clearTimeout(delTimer);tryDelete(a.dataset.sec,id);}
    else{S.delArm=id;clearTimeout(delTimer);delTimer=setTimeout(()=>{S.delArm=null;renderList();},4000);renderList();}
  }
  else if(act==='csv'){exportCsv(a.dataset.b);}
  else if(act==='clearsample'){clearSamples();}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;renderList();}});
document.addEventListener('change',e=>{if(e.target.id==='showdone'){S.showDone=e.target.checked;renderList();}});


/* ---------- standalone: file download, backup and restore ---------- */
function saveBlob(filename,data,type){
  const b=new Blob([data],{type:type});const u=URL.createObjectURL(b);
  const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),1500);
}
dl={save:async o=>{saveBlob(o.filename,o.data,'text/csv;charset=utf-8');return {status:'saved'};}};
function backupAll(){
  const out={app:'order-desk',version:1,exported:new Date().toISOString(),data:{}};
  COS.forEach(c=>{out.data[c.key]={};SECS.forEach(s=>{out.data[c.key][s]=[...D[c.key][s].values()];});});
  saveBlob('order-desk-backup-'+todayStr()+'.json',JSON.stringify(out,null,1),'application/json');
  toast('Backup downloaded');
}
function restoreAll(file){
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      const j=JSON.parse(fr.result);
      if(!j||j.app!=='order-desk'||!j.data)throw new Error('bad');
      if(!window.confirm('Restore this backup? It replaces everything currently saved in this browser.'))return;
      COS.forEach(c=>SECS.forEach(s=>{
        const rows=(j.data[c.key]&&j.data[c.key][s])||[];
        D[c.key][s]=new Map(rows.filter(r=>r&&r.id).map(r=>[r.id,r]));
        saveLocal(c.key,s);
      }));
      S.form=null;buildAll();toast('Backup restored');
    }catch(e){toast('That file is not an Order & Payment Desk backup.');}
  };
  fr.readAsText(file);
}
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');if(!a)return;
  if(a.dataset.act==='backup')backupAll();
  else if(a.dataset.act==='restore')$('#restoreFile').click();
});
document.addEventListener('change',e=>{
  if(e.target.id==='restoreFile'&&e.target.files[0]){restoreAll(e.target.files[0]);e.target.value='';}
});

/* ---------- boot ---------- */
function subscribeAll(){
  COS.forEach(c=>SECS.forEach(s=>{
    store.collection(c.key+'_'+s).onSnapshot(snap=>{
      const m=new Map();snap.docs.forEach(doc=>{const x=doc.data();m.set(doc.id,Object.assign({},x,{id:doc.id}));});
      D[c.key][s]=m;
      if(R)refresh();
    },err=>{toast('Live data stopped: '+((err&&err.code)||'unknown'));});
  }));
}

/* ---------- accounts and login gate ---------- */
const USERS_KEY='orderdesk:users',AUTH_KEY='orderdesk:auth',SESS_KEY='orderdesk:session';
const b64=u=>btoa(String.fromCharCode.apply(null,u));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function hashPw(pw,salt){
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return b64(new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:salt,iterations:150000,hash:'SHA-256'},k,256)));
}
let USERS=new Map(),ME=null,usersReady=false,gateMode='login';
const slug=u=>String(u||'').trim().toLowerCase();
const validUser=u=>/^[a-z0-9_.-]{3,30}$/i.test(u);
const isAdmin=()=>!!ME&&ME.role==='admin';
const canModify=r=>!!ME&&(ME.role==='admin'||(!!r&&!!r.createdBy&&r.createdBy===ME.id));
const whoName=r=>r&&r.createdBy?((USERS.get(r.createdBy)||{}).user||r.createdByName||'a user'):'admin';
const hasSession=()=>{try{return sessionStorage.getItem(SESS_KEY)||'';}catch(e){return '';}};
const setSession=v=>{try{if(v)sessionStorage.setItem(SESS_KEY,v);else sessionStorage.removeItem(SESS_KEY);}catch(e){}};
function saveLocalUsers(){try{localStorage.setItem(USERS_KEY,JSON.stringify([...USERS.values()]));}catch(e){}}
function loadLocalUsers(){
  try{JSON.parse(localStorage.getItem(USERS_KEY)||'[]').forEach(u=>USERS.set(u.id,u));}catch(e){}
  if(!USERS.size){try{const a=JSON.parse(localStorage.getItem(AUTH_KEY)||'null');if(a&&a.user&&a.salt&&a.hash){USERS.set(slug(a.user),{id:slug(a.user),user:a.user,salt:a.salt,hash:a.hash,role:'admin',created:todayStr()});saveLocalUsers();}}catch(e){}}
}
async function putUser(u){
  const prev=USERS.get(u.id);USERS.set(u.id,u);
  if(store){try{await store.collection('users').doc(u.id).set(u);}catch(e){if(prev)USERS.set(u.id,prev);else USERS.delete(u.id);toast('Could not save: '+((e&&(e.message||e.code))||'unknown error'));return false;}}
  else saveLocalUsers();
  return true;
}
async function removeUser(id){
  const prev=USERS.get(id);USERS.delete(id);
  if(store){try{await store.collection('users').doc(id).delete();}catch(e){if(prev)USERS.set(id,prev);toast('Could not delete the user.');return false;}}
  else saveLocalUsers();
  return true;
}
function subscribeUsers(){
  store.collection('users').onSnapshot(snap=>{
    const m=new Map();snap.docs.forEach(doc=>{m.set(doc.id,Object.assign({},doc.data(),{id:doc.id}));});
    USERS=m;
    const first=!usersReady;usersReady=true;
    if(first){gateReady();return;}
    if(ME){
      if(!USERS.has(ME.id)){ME=null;setSession('');showGate();return;}
      ME=USERS.get(ME.id);renderWho();if(S.tab==='admin'&&!isAdmin())S.tab='clients';
    }else if(!$('#gate').hidden){showGate();}
    if(R)refresh();
  },err=>{usersReady=true;toast('Live users stopped: '+((err&&err.code)||'unknown'));gateReady();});
}
function renderWho(){const w=$('#who');if(w)w.textContent=ME?ME.user+' · '+(ME.role==='admin'?'Admin':'User'):'';}
function lockApp(locked){
  const w=document.querySelector('.wrap'),g=$('#gate'),t=$('#toast');
  w.hidden=locked;g.hidden=!locked;if(locked)t.hidden=true;
}
function afterLogin(){
  lockApp(false);renderWho();
  if(S.tab==='admin'&&!isAdmin())S.tab='clients';
  S.form=null;buildAll();
}
function gateReady(){
  const sid=hasSession();
  if(sid&&USERS.has(sid)){ME=USERS.get(sid);afterLogin();}else showGate();
}
function showGate(){
  lockApp(true);
  const go=$('#g_go'),form=$('#gform');
  if(!usersReady){$('#gt').textContent='Loading…';$('#gsub').textContent='';form.hidden=true;$('#gfoot').textContent='';return;}
  form.hidden=false;
  const first=USERS.size===0,create=first||gateMode==='signup';
  $('#gt').textContent=first?'Create the admin login':(create?'Create your account':'Welcome back');
  $('#gsub').textContent=first?'This first account becomes the admin. The admin can edit or delete any entry and manage other users.':(create?'You can edit or delete only the entries you add. The admin can manage everything.':'Log in to open the desk.');
  $('#g_c_wrap').hidden=!create;
  go.textContent=create?(first?'Create admin login':'Sign up'):'Log in';
  $('#g_pass').autocomplete=create?'new-password':'current-password';
  $('#g_err').textContent='';$('#g_pass').value='';$('#g_conf').value='';
  $('#g_pass').type=$('#g_conf').type='password';$('#g_show').textContent='Show';
  let f='';
  if(!first)f+=create?'Already have an account? <button type="button" class="lnk" data-gate="login">Log in</button>':'New here? <button type="button" class="lnk" data-gate="signup">Sign up</button> &nbsp;·&nbsp; <button type="button" class="lnk" id="g_forgot">Forgot password?</button>';
  else f+='The login is saved '+(store?'in the shared store':'on this device')+'. Choose a password you will remember.';
  $('#gfoot').innerHTML=f;
  setTimeout(()=>{$('#g_user').focus();},0);
}
async function submitGate(e){
  e.preventDefault();
  const err=$('#g_err'),user=$('#g_user').value.trim(),pw=$('#g_pass').value;
  err.textContent='';
  if(!usersReady)return;
  if(!(window.crypto&&crypto.subtle)){err.textContent='This browser cannot create a secure login. Open the page in an up-to-date browser.';return;}
  const first=USERS.size===0,create=first||gateMode==='signup';
  if(create){
    if(!validUser(user))return void(err.textContent='Username needs 3 to 30 letters, numbers, dots, dashes or underscores.');
    if(pw.length<6)return void(err.textContent='Password needs at least 6 characters.');
    if(pw!==$('#g_conf').value)return void(err.textContent='The two passwords do not match.');
    if(USERS.has(slug(user)))return void(err.textContent='That username is taken. Choose another.');
    const salt=crypto.getRandomValues(new Uint8Array(16));
    const u={id:slug(user),user:user,salt:b64(salt),hash:await hashPw(pw,salt),role:first?'admin':'user',created:todayStr()};
    if(!(await putUser(u)))return;
    ME=u;setSession(u.id);gateMode='login';afterLogin();toast(first?'Admin login created':'Account created');
  }else{
    const u=USERS.get(slug(user));
    if(!u||await hashPw(pw,unb64(u.salt))!==u.hash){err.textContent='Username or password is not correct.';$('#g_pass').select();return;}
    ME=u;setSession(u.id);afterLogin();
  }
}
async function setUserPassword(uid,pw){
  const u=USERS.get(uid);if(!u)return false;
  const salt=crypto.getRandomValues(new Uint8Array(16));
  return putUser(Object.assign({},u,{salt:b64(salt),hash:await hashPw(pw,salt)}));
}
function initGate(){
  $('#gform').addEventListener('submit',submitGate);
  $('#g_show').addEventListener('click',()=>{const p=$('#g_pass'),c=$('#g_conf'),h=p.type==='password';p.type=c.type=h?'text':'password';$('#g_show').textContent=h?'Hide':'Show';});
  document.addEventListener('click',e=>{
    const t=e.target;
    if(t.dataset&&t.dataset.gate){gateMode=t.dataset.gate;showGate();}
    if(t.id==='g_forgot'){
      $('#gfoot').innerHTML=store?'Ask the admin to reset your password from the Admin page. If the admin forgot theirs, ask Claude to reset it.':'Ask the admin to reset your password from the Admin page. If the admin forgot theirs, type RESET to remove all logins on this device and start again. Your companies, invoices and payments stay as they are.<span class="gout"><input id="g_reset" type="text" autocomplete="off" aria-label="Type RESET"><button type="button" class="btn sm" id="g_reset_go">Remove all logins</button></span>';
      const r=$('#g_reset');if(r)r.focus();
    }
    if(t.id==='g_reset_go'){
      if($('#g_reset').value.trim().toUpperCase()!=='RESET'){$('#g_err').textContent='Type RESET to confirm.';return;}
      USERS=new Map();saveLocalUsers();try{localStorage.removeItem(AUTH_KEY);}catch(x){}setSession('');ME=null;gateMode='login';showGate();
    }
    if(t.closest&&t.closest('[data-act="logout"]')){ME=null;setSession('');S.form=null;gateMode='login';showGate();}
  });
  document.addEventListener('submit',async e=>{
    if(e.target.id!=='pwf')return;
    e.preventDefault();
    const pw=$('#rp_pw').value;
    if(pw.length<6){$('#ferr').textContent='Password needs at least 6 characters.';return;}
    if(await setUserPassword(e.target.dataset.uid,pw)){S.form=null;$('#formHost').innerHTML='';toast('Password changed');}
  });
  showGate();
}

/* ---------- admin ---------- */
function stdActs(sec,r){
  if(canModify(r))return '<button class="lnk" data-act="edit" data-sec="'+sec+'" data-id="'+esc(r.id)+'">Edit</button><button class="lnk del" data-act="del" data-sec="'+sec+'" data-id="'+esc(r.id)+'">'+(S.delArm===r.id?'Confirm delete':'Delete')+'</button>';
  return '<span class="muted">Added by '+esc(whoName(r))+'</span>';
}
function countBy(uid){let n=0;COS.forEach(c=>SECS.forEach(s=>D[c.key][s].forEach(r=>{if(r.createdBy===uid)n++;})));return n;}
function userActs(u){
  if(ME&&u.id===ME.id)return '<span class="muted">You</span>';
  const arm=S.delArm==='u:'+u.id;
  return '<button class="lnk" data-act="urole" data-id="'+esc(u.id)+'">'+(u.role==='admin'?'Make user':'Make admin')+'</button><button class="lnk" data-act="upw" data-id="'+esc(u.id)+'">Reset password</button><button class="lnk del" data-act="udel" data-id="'+esc(u.id)+'">'+(arm?'Confirm delete':'Delete')+'</button>';
}
function adminEntries(){
  const d=D[S.co],out=[],P=d.products;
  const pn=id=>{const p=P.get(id);return p?p.name:'(removed product)';};
  const push=(sec,label,r,text,date)=>out.push({id:r.id,sec:sec,label:label,text:text,date:date||'',rec:r});
  d.clients.forEach(r=>push('clients','Client',r,r.name+(r.brand?' · '+r.brand:''),''));
  d.products.forEach(r=>push('products','Product',r,r.name,''));
  d.advances.forEach(r=>push('advances','Advance',r,pn(r.productId)+' · PO '+r.po+' · '+inr(r.received),r.date));
  d.invoices.forEach(r=>push('invoices','Invoice',r,'Invoice '+r.invNo+' · '+pn(r.productId)+' · PO '+r.po+' · qty '+qty(r.qty),r.date));
  d.payments.forEach(r=>{const iv=d.invoices.get(r.invoiceId);push('payments','Payment',r,inr(r.amount)+' · invoice '+(iv?iv.invNo:'(removed)'),r.date);});
  d.dispatches.forEach(r=>push('dispatches','Dispatch',r,pn(r.productId)+' · PO '+r.po+' · qty '+qty(r.qty)+(r.lr?' · LR '+r.lr:''),r.date));
  return out.sort((a,b)=>String(b.date).localeCompare(String(a.date)));
}
function showPwReset(uid){
  const u=USERS.get(uid);if(!u)return;
  $('#formHost').innerHTML='<form id="pwf" class="form" data-uid="'+esc(uid)+'" novalidate><h3>Reset password for '+esc(u.user)+'</h3><div class="grid"><div class="f"><label for="rp_pw">New password</label><input id="rp_pw" type="text" autocomplete="off"></div></div><div class="fa"><button class="btn primary" type="submit">Save password</button><button class="btn" type="button" data-act="cancel">Cancel</button><span id="ferr" class="ferr" role="alert"></span></div><p class="muted">Tell the user their new password. They can log in with it straight away.</p></form>';
  $('#rp_pw').focus();
}

initGate();
loadUI();
buildAll();
loadLocal();loadLocalUsers();usersReady=true;gateReady();
buildAll();
})();
